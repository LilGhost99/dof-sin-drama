name: Actualizar DOF

on:
  schedule:
    - cron: "30 13 * * 1-6"
    - cron: "0 15 * * 1-6"
    - cron: "0 20 * * 1-6"
    - cron: "0 2 * * 2-6"
  workflow_dispatch:
    inputs:
      dias_atras:
        description: "Días anteriores a revisar"
        default: "1"

permissions:
  contents: write

concurrency:
  group: dof
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Descargar y clasificar el DOF
        run: python scripts/fetch_dof.py --dias-atras "${{ github.event.inputs.dias_atras || '1' }}"
      - name: Guardar cambios
        run: |
          mkdir -p data
          git config user.name "dof-bot"
          git config user.email "dof-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "DOF: actualización"
            git push
          fi
