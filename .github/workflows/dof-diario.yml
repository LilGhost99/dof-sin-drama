name: Actualizar DOF

on:
  schedule:
    # GitHub usa UTC. CDMX = UTC-6 (sin horario de verano).
    # El DOF matutino sale entre 6 y 8 am: se revisa cada 20 min de 6:07 a 8:47.
    # Minutos "raros" a propósito: GitHub retrasa o salta los horarios en :00 y :30.
    - cron: "7,27,47 12-14 * * 1-6"   # 6:07 a 8:47 CDMX
    - cron: "17 16 * * 1-6"           # 10:17 CDMX, por si se retrasó
    - cron: "13 20 * * 1-6"           # 14:13 CDMX (vespertina)
    - cron: "43 1 * * 2-6"            # 19:43 CDMX (vespertina tardía)
  workflow_dispatch:
    inputs:
      dias_atras:
        description: "Días anteriores a revisar"
        default: "1"

permissions:
  contents: write

concurrency:
  group: dof
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Descargar y clasificar el DOF
        run: python scripts/fetch_dof.py --dias-atras "${{ github.event.inputs.dias_atras || '1' }}"
      - name: Guardar cambios
        run: |
          mkdir -p data
          git config user.name "dof-bot"
          git config user.email "dof-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "DOF: actualización"
            git pull --rebase origin main
            git push
          fi
